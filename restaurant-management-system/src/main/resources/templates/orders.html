<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foodzilla - My Orders</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        :root{
            --primary:#ff6b35;
            --secondary:#ff914d;
            --light:#fff8f3;
        }


        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }


        body{
            background:var(--light);
        }


        /* NAVBAR */

        .navbar{

        background:linear-gradient(135deg,var(--primary),var(--secondary));

        padding:12px 30px;

        }


        .logo{

        color:white;
        font-size:28px;
        font-weight:bold;

        }




        /* SIDEBAR */


        .sidebar{

        position:fixed;

        top:65px;

        left:0;

        width:250px;

        height:100%;

        background:white;

        box-shadow:2px 0 10px rgba(0,0,0,.1);

        padding-top:20px;

        }



        .sidebar a{

        display:block;

        padding:15px 25px;

        text-decoration:none;

        color:#444;

        font-size:17px;

        }



        .sidebar a:hover{

        background:var(--primary);

        color:white;

        }



        .sidebar i{

        margin-right:10px;

        }





        /* MAIN */

        .main-content{

        margin-left:250px;

        padding:30px;

        }





        /* HERO */


        .hero{

        background:

        linear-gradient(
        rgba(0,0,0,.45),
        rgba(0,0,0,.45)
        ),

        url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4");


        background-size:cover;

        background-position:center;

        padding:50px 40px;

        border-radius:20px;

        color:white;

        margin-bottom:30px;

        }



        .hero h1{

        font-size:40px;

        font-weight:bold;

        }





        /* ORDER CARD */


        .order-card{

        background:white;

        border-radius:20px;

        padding:25px;

        box-shadow:0 5px 18px rgba(0,0,0,.1);

        margin-bottom:25px;

        transition:.3s;

        }



        .order-card:hover{

        transform:translateY(-5px);

        }




        .order-header{

        display:flex;

        justify-content:space-between;

        align-items:center;

        }




        .order-id{

        color:var(--primary);

        font-weight:bold;

        font-size:20px;

        }




        .price{

        font-size:22px;

        font-weight:bold;

        color:var(--primary);

        }




        .status{

        padding:8px 18px;

        border-radius:20px;

        color:white;

        font-weight:bold;

        }



        .preparing{

        background:orange;

        }



        .delivered{

        background:green;

        }



        .pending{

        background:dodgerblue;

        }



        .cancelled{

        background:red;

        }





        .item-box{

        background:#fff8f3;

        padding:12px;

        border-radius:12px;

        margin-top:10px;

        }



        .btn-food{

        background:var(--primary);

        color:white;

        border:none;

        }



        .btn-food:hover{

        background:#e85b28;

        color:white;

        }





    </style>

</head>



<body>


<!-- NAVBAR -->


<nav class="navbar">


    <div class="container-fluid">


        <div class="logo">

            🍽️ Foodzilla

        </div>



        <div class="text-white">

            <i class="fa-solid fa-user"></i>

            Welcome User

        </div>


    </div>


</nav>






<!-- SIDEBAR -->


<div class="sidebar">


    <a href="/user-dashboard">

        <i class="fa-solid fa-house"></i>
        Dashboard

    </a>


    <a href="/menu">

        <i class="fa-solid fa-utensils"></i>
        Menu

    </a>


    <a href="/cart">

        <i class="fa-solid fa-cart-shopping"></i>
        Cart

    </a>


    <a href="/my-orders">

        <i class="fa-solid fa-box"></i>
        Orders

    </a>


    <a href="/payments">

        <i class="fa-solid fa-credit-card"></i>
        Payments

    </a>


    <a href="/profile">

        <i class="fa-solid fa-user"></i>
        Profile

    </a>


</div>







<!-- MAIN CONTENT -->


<div class="main-content">



    <div class="hero">


        <h1>
            📦 My Orders
        </h1>


        <p>
            Track your delicious food orders anytime.
        </p>


    </div>







    <h3 class="mb-4">
        Order History
    </h3>







    <!-- DYNAMIC ORDERS -->


    <div th:if="${#lists.isEmpty(orders)}">


        <div class="order-card text-center">


            <h3>
                No Orders Yet 🍽️
            </h3>


            <p>
                Start ordering your favorite meals.
            </p>


            <a href="/user-dashboard" class="btn btn-food">

                Browse Menu

            </a>


        </div>


    </div>








    <div th:each="order : ${orders}" class="order-card">



        <div class="order-header">


            <h3>

                Order #

                <span th:text="${order.id}"></span>

            </h3>



            <span class="status"
                  th:classappend="${order.status == 'Delivered'} ? 'delivered' :
                     (${order.status == 'Preparing'} ? 'preparing' :
                     (${order.status == 'Cancelled'} ? 'cancelled' : 'pending'))"
                  th:text="${order.status}">

</span>



        </div>




        <hr>




        <p>

            <strong>Customer:</strong>

            <span th:text="${order.customerName}"></span>

        </p>




        <p>

            <strong>Phone:</strong>

            <span th:text="${order.phone}"></span>

        </p>




        <p>

            <strong>Order Type:</strong>

            <span th:text="${order.orderType}"></span>

        </p>




        <p>

            <strong>Date:</strong>

            <span th:text="${order.orderDate}"></span>

        </p>





        <h4>

            Items

        </h4>




        <div th:each="item : ${order.items}" class="item-box">


<span th:text="${item.name}">
Food Item
</span>


        </div>






        <h4 class="mt-3">

            Total:

            <span class="price">

$
<span th:text="${order.totalAmount}"></span>

</span>


        </h4>





        <button class="btn btn-food mt-3">

            View Details

        </button>



        <button class="btn btn-success mt-3">

            Reorder

        </button>



    </div>







</div>



</body>

</html>
