<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Foodzilla - My Orders</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        :root{
            --primary:#ff6b35;
            --secondary:#ff914d;
            --light:#fff8f3;
        }


        body{
            background:var(--light);
            font-family:'Segoe UI',sans-serif;
        }


        /* NAVBAR */

        .navbar{

        background:linear-gradient(135deg,var(--primary),var(--secondary));

        padding:15px 30px;

        }


        .logo{

        color:white;

        font-size:28px;

        font-weight:bold;

        }


        /* SIDEBAR */


        .sidebar{

        position:fixed;

        top:65px;

        left:0;

        width:250px;

        height:100%;

        background:white;

        padding-top:20px;

        box-shadow:2px 0 10px rgba(0,0,0,.1);

        }



        .sidebar a{

        display:block;

        padding:15px 25px;

        text-decoration:none;

        color:#444;

        font-size:17px;

        }


        .sidebar a:hover{

        background:var(--primary);

        color:white;

        }


        /* CONTENT */


        .main-content{

        margin-left:250px;

        padding:30px;

        }



        /* HERO */


        .hero{

        background:
        linear-gradient(
        rgba(0,0,0,.5),
        rgba(0,0,0,.5)
        ),
        url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4");


        background-size:cover;

        background-position:center;

        padding:50px;

        border-radius:20px;

        color:white;

        margin-bottom:30px;

        }


        /* ORDER CARD */


        .order-card{

        background:white;

        padding:25px;

        border-radius:20px;

        box-shadow:0 5px 20px rgba(0,0,0,.1);

        margin-bottom:25px;

        }



        .status{

        padding:8px 18px;

        border-radius:20px;

        color:white;

        background:dodgerblue;

        font-weight:bold;

        }



        .item-box{

        background:#fff8f3;

        padding:15px;

        border-radius:12px;

        margin-top:10px;

        }



        .price{

        font-size:22px;

        font-weight:bold;

        color:var(--primary);

        }


        .btn-food{

        background:var(--primary);

        color:white;

        }


    </style>


</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="container-fluid">


        <div class="logo">

            🍽️ Foodzilla

        </div>


        <div class="text-white">

            <i class="fa-solid fa-user"></i>

            Welcome User

        </div>


    </div>

</nav>




<!-- SIDEBAR -->


<div class="sidebar">


    <a href="/user-dashboard">

        <i class="fa-solid fa-house"></i>

        Dashboard

    </a>


    <a href="/user-dashboard">

        <i class="fa-solid fa-utensils"></i>

        Menu

    </a>


    <a href="/cart">

        <i class="fa-solid fa-cart-shopping"></i>

        Cart

    </a>


    <a href="/my-orders">

        <i class="fa-solid fa-box"></i>

        Orders

    </a>


    <a href="/profile">

        <i class="fa-solid fa-user"></i>

        Profile

    </a>


</div>




<!-- MAIN -->


<div class="main-content">


    <div class="hero">

        <h1>

            📦 My Orders

        </h1>


        <p>

            Track your delicious food orders.

        </p>


    </div>





    <div th:if="${#lists.isEmpty(orders)}">


        <div class="order-card text-center">


            <h3>

                No Orders Yet 🍽️

            </h3>


            <p>

                Start ordering your favorite meals.

            </p>


            <a href="/user-dashboard"
               class="btn btn-food">

                Browse Menu

            </a>


        </div>


    </div>





    <div th:each="order : ${orders}"
         class="order-card">



        <div class="d-flex justify-content-between">


            <h3>

                Order #

                <span th:text="${order.id}"></span>

            </h3>



        </div>


        <hr>



        <p>

            <strong>Customer:</strong>

            <span th:text="${order.customerName}"></span>

        </p>



        <p>

            <strong>Phone:</strong>

            <span th:text="${order.phone}"></span>

        </p>



        <p>

            <strong>Order Type:</strong>

            <span th:text="${order.orderType}"></span>

        </p>



        <p>

            <strong>Date:</strong>

            <span th:text="${order.orderDate}"></span>

        </p>





        <h4>

            Items

        </h4>



        <div th:each="item : ${order.items}"
             class="item-box">


            <p>

                <strong>Quantity:</strong>

                <span th:text="${item.quantity}"></span>

            </p>



            <p>

                <strong>Price:</strong>

                $

                <span th:text="${item.price}"></span>

            </p>


        </div>





        <h4 class="mt-3">


            Total:

            <span class="price">

$

<span th:text="${order.totalAmount}"></span>

</span>


        </h4>




        <button class="btn btn-food">

            View Details

        </button>


        <button class="btn btn-success"
        >

            Reorder

        </button>
        <a href="user-dashboard.html">
            Reorder
        </a>



    </div>



</div>



</body>

</html>
