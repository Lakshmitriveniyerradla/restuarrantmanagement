<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment - Foodzilla</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        :root{
            --primary:#ff6b35;
            --secondary:#ff914d;
            --light:#fff8f3;
        }


        body{
            background:var(--light);
            font-family:'Segoe UI',sans-serif;
        }


        .navbar{

            background:linear-gradient(135deg,var(--primary),var(--secondary));
            padding:12px 25px;

        }


        .logo{

            color:white;
            font-size:28px;
            font-weight:bold;

        }


        .payment-card{

            background:white;
            border-radius:20px;
            padding:35px;
            margin-top:50px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);

        }


        .summary{

            background:#fff8f3;
            border-radius:15px;
            padding:20px;
            margin-bottom:25px;

        }


        .form-control,
        .form-select{

            border-radius:12px;
            padding:12px;

        }


        .btn-pay{

            background:#ff6b35;
            color:white;
            border:none;
            border-radius:12px;
            padding:14px;
            font-size:18px;
            font-weight:bold;

        }


        .btn-pay:hover{

            background:#e85b28;
            color:white;

        }


    </style>

</head>



<body>



<nav class="navbar">

    <div class="container">

        <div class="logo">

            🍽️ Foodzilla

        </div>


        <a href="/cart" class="btn btn-light">

            Back To Cart

        </a>


    </div>

</nav>





<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">


            <div class="payment-card">


                <h2 class="text-center mb-4">

                    💳 Complete Payment

                </h2>




                <div class="summary">


                    <h5>

                        Order Summary

                    </h5>


                    <p>

                        Your cart items will be processed.

                    </p>


                    <h4 id="totalAmount">

                        Total: $0

                    </h4>


                </div>




                <label class="form-label">

                    Payment Method

                </label>


                <select id="paymentMethod"
                        class="form-select mb-4">


                    <option>

                        Cash On Delivery

                    </option>


                    <option>

                        Credit / Debit Card

                    </option>


                    <option>

                        UPI

                    </option>


                </select>





                <label class="form-label">

                    Card Number

                </label>


                <input class="form-control mb-3"
                       placeholder="XXXX XXXX XXXX XXXX">





                <div class="row">


                    <div class="col-md-6">


                        <label>

                            Expiry

                        </label>


                        <input class="form-control"
                               placeholder="MM/YY">


                    </div>




                    <div class="col-md-6">


                        <label>

                            CVV

                        </label>


                        <input class="form-control"
                               placeholder="123">


                    </div>


                </div>





                <button id="payButton"
                        type="button"
                        class="btn btn-pay w-100 mt-4">


                    Pay Now ✅


                </button>




            </div>


        </div>


    </div>


</div>






<script>


    let cart = JSON.parse(localStorage.getItem("cart")) || [];



    let total = cart.reduce(
        (sum,item)=> sum + item.price,
        0
    );



    document.getElementById("totalAmount").innerHTML =
    "Total: $" + total;







    document.getElementById("payButton")
    .addEventListener("click", function(){



    console.log("PAY BUTTON CLICKED");



    if(cart.length === 0){


    alert("Your cart is empty");


    return;


    }




    let order = {


    customerName:"Guest User",


    phone:"0000000000",


    orderType:"Delivery",


    totalAmount:total,



    items:cart.map(item=>({


    menuItem:{


    id:item.id


    },


    quantity:item.quantity || 1,


    price:item.price


    }))



    };




    console.log(order);






    fetch("/place-order",{


    method:"POST",


    headers:{


    "Content-Type":"application/json"


    },


    body:JSON.stringify(order)


    })



    .then(response=>{


    console.log("Response:",response);


    return response.json();


    })



    .then(data=>{


    console.log("Saved:",data);


    alert("Payment Successful 🎉");


    localStorage.removeItem("cart");


    window.location.href="/my-orders";


    })



    .catch(error=>{


    console.log(error);


    alert("Order failed");


    });



    });



</script>



</body>

</html>
