<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pizza Menu - Foodzilla</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        :root{
            --primary:#ff6b35;
            --secondary:#ff914d;
            --light:#fff8f3;
        }


        body{
            background:var(--light);
            font-family:'Segoe UI',sans-serif;
        }


        /* NAVBAR */

        .navbar{

        background:linear-gradient(135deg,var(--primary),var(--secondary));

        padding:8px 15px;

        }


        .logo{

        color:white;
        font-size:28px;
        font-weight:bold;

        }


        /* HEADER */

        .hero{

        background:linear-gradient(135deg,var(--primary),var(--secondary));

        color:white;

        padding:40px;

        border-radius:20px;

        margin:30px 0;

        }


        .hero h1{

        font-size:40px;
        font-weight:bold;

        }


        /* FOOD CARD */

        .food-card{

        border:none;

        border-radius:18px;

        overflow:hidden;

        box-shadow:0 5px 18px rgba(0,0,0,0.1);

        transition:.3s;

        }


        .food-card:hover{

        transform:translateY(-8px);

        }



        .food-card img{

        height:230px;

        object-fit:cover;

        }



        .price{

        color:var(--primary);

        font-size:22px;

        font-weight:bold;

        }



        .btn-cart{

        background:var(--primary);

        color:white;

        width:100%;

        border:none;

        }



        .btn-cart:hover{

        background:#e85b28;

        color:white;

        }



    </style>

</head>



<body>


<!-- NAVBAR -->

<nav class="navbar">


    <div class="container">


        <div class="logo">

            🍽️ Foodzilla

        </div>



        <a href="/user-dashboard" class="btn btn-light">

            <i class="fa-solid fa-arrow-left"></i>

            Back To Menu

        </a>


    </div>


</nav>





<div class="container">



    <!-- HERO -->


    <div class="hero">


        <h1>
            🍕 Pizza Collection
        </h1>


        <p>

            Freshly baked pizzas with premium toppings.

        </p>


    </div>





    <div class="row g-4">





        <!-- Paneer Pizza -->


        <div class="col-md-4">


            <div class="card food-card">


                <img src="/images/paneerpizza.jpg"
                     class="card-img-top">


                <div class="card-body">


                    <h4>
                        Paneer Pizza
                    </h4>


                    <p>
                        Indian style pizza with spicy paneer toppings.
                    </p>


                    <div class="price">
                        $14.99
                    </div>



                    <button class="btn btn-cart mt-3"
                            onclick="addToCart('Paneer Pizza',14.99)">

                        Add To Cart

                    </button>


                </div>


            </div>


        </div>







        <!-- Chicken Tandoori Pizza -->


        <div class="col-md-4">


            <div class="card food-card">


                <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38"
                     class="card-img-top">


                <div class="card-body">


                    <h4>
                        Chicken Tandoori Pizza
                    </h4>


                    <p>
                        Tandoori chicken with cheese and herbs.
                    </p>


                    <div class="price">
                        $16.99
                    </div>



                    <button class="btn btn-cart mt-3"
                            onclick="addToCart('Chicken Tandoori Pizza',16.99)">

                        Add To Cart

                    </button>


                </div>


            </div>


        </div>








        <!-- Cheese Pizza -->


        <div class="col-md-4">


            <div class="card food-card">


                <img src="/images/cheese.jpg"
                     class="card-img-top">"


                <div class="card-body">


                    <h4>
                        Classic Cheese Pizza
                    </h4>


                    <p>
                        Loaded mozzarella cheese pizza.
                    </p>


                    <div class="price">
                        $12.99
                    </div>



                    <button class="btn btn-cart mt-3"
                            onclick="addToCart('Classic Cheese Pizza',12.99)">

                        Add To Cart

                    </button>


                </div>


            </div>


        </div>






    </div>


</div>







<script>


    function addToCart(name,price){


    let cart = JSON.parse(localStorage.getItem("cart")) || [];



    cart.push({

    name:name,

    price:price,

    quantity:1

    });



    localStorage.setItem(

    "cart",

    JSON.stringify(cart)

    );



    window.location.href="/cart";


    }


</script>



</body>

</html>
