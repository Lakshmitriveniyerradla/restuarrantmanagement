<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodzilla - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            height:100vh;
            overflow:hidden;
            background:#f8f9fa;
        }

        .main-container{
            display:flex;
            height:100vh;
        }

        /* LEFT SIDE */
        .left-panel{
            width:55%;
            background:linear-gradient(135deg,#ff6b35,#ff914d);
            color:white;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:50px;
            position:relative;
        }

        .logo-circle{
            width:140px;
            height:140px;
            background:white;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:70px;
            margin-bottom:25px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        .restaurant-name{
            font-size:55px;
            font-weight:800;
            margin-bottom:15px;
        }

        .tagline{
            font-size:22px;
            opacity:0.95;
        }

        .food-icons{
            position:absolute;
            bottom:30px;
            font-size:40px;
            letter-spacing:20px;
        }

        /* RIGHT SIDE */
        .right-panel{
            width:45%;
            display:flex;
            justify-content:center;
            align-items:center;
            background:white;
        }

        .login-card{
            width:420px;
            padding:40px;
        }

        .login-title{
            font-size:35px;
            font-weight:700;
            margin-bottom:10px;
        }

        .login-subtitle{
            color:#777;
            margin-bottom:30px;
        }

        .form-control{
            height:55px;
            border-radius:12px;
        }

        .btn-login{
            background:#ff6b35;
            border:none;
            height:55px;
            border-radius:12px;
            font-size:18px;
            font-weight:600;
            color:white;
            width:100%;
        }

        .btn-login:hover{
            background:#e95d2a;
        }

        .signup-link{
            text-align:center;
            margin-top:20px;
        }

        @media(max-width:992px){

            .left-panel{
                display:none;
            }

            .right-panel{
                width:100%;
            }
        }
    </style>
</head>
<body>

<div class="main-container">

    <!-- LEFT SIDE -->
    <div class="left-panel">

        <div class="logo-circle">
            🍽️
        </div>

        <h1 class="restaurant-name">
            FoodZilla
        </h1>

        <p class="tagline">
            Fresh • Delicious • Memorable
        </p>

        <p class="mt-4 fs-5">
            Delicious Memories Start Here
        </p>

        <div class="food-icons">
            🍕 🍔 🍜 🍗 🥗
        </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right-panel">

        <div class="login-card">

            <h2 class="login-title">
                Welcome Back 👋
            </h2>

            <p class="login-subtitle">
                Sign in to continue your food journey
            </p>

            <form action="/login" method="post">

                <div class="mb-3">
                    <input type="text"
                           class="form-control"
                           name="username"
                           placeholder="Username"
                           required>
                </div>

                <div class="mb-3">
                    <input type="password"
                           class="form-control"
                           name="password"
                           placeholder="Password"
                           required>
                </div>

                <div class="mb-3 text-end">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login">
                    Login
                </button>

                <div class="signup-link">
                    Don't have an account?
                    <a href="/signup">Register Now</a>
                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
