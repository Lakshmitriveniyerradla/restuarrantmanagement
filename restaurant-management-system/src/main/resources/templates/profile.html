<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">


<head>


    <meta charset="UTF-8">


    <title>Foodzilla - Profile</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">



    <style>


        :root{

        --primary:#ff6b35;

        --secondary:#ff914d;

        --light:#fff8f3;

        }



        *{

        margin:0;

        padding:0;

        box-sizing:border-box;

        font-family:'Segoe UI',sans-serif;

        }



        body{

        background:var(--light);

        }





        /* NAVBAR */


        .navbar{

        background:linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
        );

        padding:15px 30px;

        }



        .logo{

        font-size:28px;

        font-weight:bold;

        color:white;

        }






        /* SIDEBAR */


        .sidebar{

        position:fixed;

        top:70px;

        left:0;

        width:250px;

        height:100%;

        background:white;

        box-shadow:2px 0 10px rgba(0,0,0,.1);

        padding-top:20px;

        }



        .sidebar a{

        display:block;

        padding:15px 25px;

        color:#444;

        text-decoration:none;

        font-size:17px;

        }



        .sidebar a:hover{

        background:var(--primary);

        color:white;

        }



        .sidebar i{

        margin-right:10px;

        }






        /* CONTENT */


        .main-content{

        margin-left:250px;

        padding:35px;

        }






        .hero{


        background:

        linear-gradient(
        rgba(0,0,0,.45),
        rgba(0,0,0,.45)
        ),

        url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4");


        background-size:cover;

        background-position:center;

        padding:45px;

        border-radius:20px;

        color:white;

        margin-bottom:30px;


        }



        .hero h1{

        font-size:38px;

        font-weight:bold;

        }






        /* PROFILE */


        .profile-card{

        background:white;

        padding:35px;

        border-radius:25px;

        box-shadow:0 5px 20px rgba(0,0,0,.1);

        text-align:center;

        }



        .profile-image{

        width:120px;

        height:120px;

        border-radius:50%;

        border:5px solid var(--primary);

        margin-bottom:20px;

        }



        .profile-card h2{

        font-weight:bold;

        }




        .info-box{

        background:#fff8f3;

        padding:20px;

        border-radius:15px;

        margin-top:20px;

        text-align:left;

        }



        .info-box p{

        font-size:16px;

        }



        .info-box i{

        color:var(--primary);

        width:30px;

        }



        .btn-food{

        background:var(--primary);

        color:white;

        border:none;

        border-radius:25px;

        padding:12px 30px;

        }



        .btn-food:hover{

        background:#e85b28;

        color:white;

        }



    </style>


</head>




<body>



<nav class="navbar">


    <div class="container-fluid">


        <div class="logo">

            🍽️ Foodzilla

        </div>


        <div class="text-white">

            <i class="fa-solid fa-user"></i>

            Welcome

        </div>


    </div>


</nav>





<div class="sidebar">


    <a href="/user-dashboard">

        <i class="fa-solid fa-house"></i>

        Dashboard

    </a>



    <a href="/menu">

        <i class="fa-solid fa-utensils"></i>

        Menu

    </a>



    <a href="/cart">

        <i class="fa-solid fa-cart-shopping"></i>

        Cart

    </a>



    <a href="/my-orders">

        <i class="fa-solid fa-box"></i>

        Orders

    </a>



    <a href="/profile">

        <i class="fa-solid fa-user"></i>

        Profile

    </a>



</div>







<div class="main-content">



    <div class="hero">


        <h1>

            👤 My Profile

        </h1>


        <p>

            Your account information

        </p>


    </div>







    <div class="row justify-content-center">


        <div class="col-md-6">



            <div class="profile-card">


                <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                     class="profile-image">



                <h2 th:text="${user.name}">
                    User Name
                </h2>



                <p>

                    Foodzilla Member 🍽️

                </p>





                <div class="info-box">



                    <p>

                        <i class="fa-solid fa-user"></i>

                        <b>Name:</b>

                        <span th:text="${user.name}"></span>

                    </p>





                    <p>

                        <i class="fa-solid fa-id-card"></i>

                        <b>Username:</b>

                        <span th:text="${user.username}"></span>

                    </p>






                    <p>

                        <i class="fa-solid fa-envelope"></i>

                        <b>Email:</b>

                        <span th:text="${user.email}"></span>

                    </p>




                    <p>

                        <i class="fa-solid fa-user-shield"></i>

                        <b>Role:</b>

                        <span th:text="${user.role}"></span>

                    </p>




                </div>




                <button class="btn btn-food mt-3">

                    <i class="fa-solid fa-pen"></i>

                    Edit Profile

                </button>



            </div>



        </div>


    </div>





</div>



</body>


</html>
