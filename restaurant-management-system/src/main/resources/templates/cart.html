<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Foodzilla - Cart</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>


        :root{

        --primary:#ff6b35;
        --secondary:#ff914d;
        --light:#fff8f3;

        }



        *{

        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI',sans-serif;

        }



        body{

        background:var(--light);

        }



        /* NAVBAR */

        .navbar{

        background:linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
        );

        padding:15px 30px;

        }


        .logo{

        color:white;

        font-size:28px;

        font-weight:bold;

        }



        /* SIDEBAR */


        .sidebar{

        position:fixed;

        top:70px;

        left:0;

        width:250px;

        height:100%;

        background:white;

        box-shadow:2px 0 10px rgba(0,0,0,.1);

        padding-top:20px;

        }



        .sidebar a{

        display:block;

        padding:15px 25px;

        text-decoration:none;

        color:#444;

        font-size:17px;

        }



        .sidebar a:hover{

        background:var(--primary);

        color:white;

        }



        .sidebar i{

        margin-right:10px;

        }



        /* MAIN */


        .main-content{

        margin-left:250px;

        padding:35px;

        }



        /* HERO */


        .hero{

        background:

        linear-gradient(
        rgba(0,0,0,.45),
        rgba(0,0,0,.45)
        ),

        url("https://images.unsplash.com/photo-1504674900247-0877df9cc836");


        background-size:cover;

        background-position:center;

        padding:45px;

        border-radius:20px;

        color:white;

        margin-bottom:30px;

        }



        .hero h1{

        font-size:38px;

        font-weight:bold;

        }





        /* CART CARD */


        .cart-card{

        background:white;

        border-radius:20px;

        padding:20px;

        box-shadow:0 5px 18px rgba(0,0,0,.1);

        margin-bottom:20px;

        display:flex;

        align-items:center;

        justify-content:space-between;

        }



        .food-image{

        width:100px;

        height:100px;

        border-radius:15px;

        object-fit:cover;

        }




        .food-info{

        flex:1;

        margin-left:20px;

        }



        .food-info h4{

        font-weight:bold;

        }



        .price{

        color:var(--primary);

        font-size:20px;

        font-weight:bold;

        }




        .btn-food{

        background:var(--primary);

        color:white;

        border:none;

        }



        .btn-food:hover{

        background:#e85b28;

        color:white;

        }



        .total-box{

        background:white;

        padding:30px;

        border-radius:20px;

        box-shadow:0 5px 15px rgba(0,0,0,.1);

        }



        .total{

        font-size:28px;

        font-weight:bold;

        color:var(--primary);

        }




    </style>


</head>


<body>



<nav class="navbar">

    <div class="container-fluid">


        <div class="logo">

            🍽️ Foodzilla

        </div>


        <div class="text-white">

            <i class="fa-solid fa-user"></i>

            Welcome User

        </div>


    </div>

</nav>





<div class="sidebar">


    <a href="/user-dashboard">

        <i class="fa-solid fa-house"></i>

        Dashboard

    </a>


    <a href="/user-dashboard">

        <i class="fa-solid fa-utensils"></i>

        Menu

    </a>



    <a href="/cart">

        <i class="fa-solid fa-cart-shopping"></i>

        Cart

    </a>



    <a href="/my-orders">

        <i class="fa-solid fa-box"></i>

        Orders

    </a>



    <a href="/profile">

        <i class="fa-solid fa-user"></i>

        Profile

    </a>


</div>





<div class="main-content">



    <div class="hero">


        <h1>

            🛒 Your Cart

        </h1>


        <p>

            Review your delicious selections

        </p>


    </div>





    <div id="cartItems">


    </div>





    <div class="total-box mt-4">


        <h3>

            Order Summary

        </h3>


        <hr>


        <h4>

            Total:

            <span class="total">

$<span id="totalAmount">0</span>

</span>


        </h4>



        <a href="/checkout"
           class="btn btn-food w-100 mt-3">

            Proceed To Checkout 💳

        </a>


    </div>




</div>







<script>


    let cart =
    JSON.parse(localStorage.getItem("cart")) || [];



    let container =
    document.getElementById("cartItems");



    let total = 0;



    cart.forEach((item,index)=>{


    total += item.price * item.quantity;



    container.innerHTML += `


    <div class="cart-card">


    <img src="${item.image}"
    class="food-image">


    <div class="food-info">


    <h4>

    ${item.name}

    </h4>


    <p>

    Quantity: ${item.quantity}

    </p>


    </div>



    <div>

    <p class="price">

    $${item.price}

    </p>



    <button class="btn btn-danger"
    onclick="removeItem(${index})">

    Remove

    </button>


    </div>


    </div>


    `;



    });



    document.getElementById("totalAmount").innerHTML = total;





    function removeItem(index){


    cart.splice(index,1);


    localStorage.setItem(
    "cart",
    JSON.stringify(cart)
    );


    location.reload();


    }



</script>



</body>

</html>
