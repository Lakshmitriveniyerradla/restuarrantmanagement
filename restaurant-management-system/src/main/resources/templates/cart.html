<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Foodzilla Cart</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        body{
            background:#f8f9fa;
        }


        .cart-card{
            background:white;
            border-radius:15px;
            padding:30px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
        }


    </style>


</head>


<body>


<!-- Header -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">


        <a class="navbar-brand fw-bold">

            🦖 Foodzilla

        </a>


        <div>

            <a href="/user-dashboard" class="btn btn-warning me-2">

                Continue Shopping

            </a>


        </div>


    </div>

</nav>





<div class="container mt-5">


    <div class="cart-card">


        <h1 class="text-center mb-4">

            🛒 Your Cart

        </h1>



        <table class="table table-bordered">


            <thead class="table-dark">


            <tr>

                <th>
                    Food Item
                </th>


                <th>
                    Price
                </th>


                <th>
                    Quantity
                </th>


                <th>
                    Total
                </th>


                <th>
                    Action
                </th>


            </tr>


            </thead>



            <tbody id="cartItems">


            </tbody>



        </table>




        <div class="text-end">


            <h3 id="totalAmount">

                Total: $0

            </h3>




            <a href="/checkout"
               class="btn btn-success btn-lg mt-3">

                Proceed To Checkout 💳

            </a>


        </div>



    </div>


</div>






<script>


    let cart = JSON.parse(localStorage.getItem("cart")) || [];


    let cartTable = document.getElementById("cartItems");


    let total = 0;



    if(cart.length === 0){


    cartTable.innerHTML = `

    <tr>

    <td colspan="5" class="text-center">

    <h4>Your cart is empty 🛒</h4>

    </td>

    </tr>

    `;



    }




    cart.forEach((item,index)=>{


    let itemTotal = item.price;


    total += itemTotal;



    cartTable.innerHTML += `


    <tr>


    <td>

    ${item.name}

    </td>



    <td>

    $${item.price}

    </td>



    <td>

    1

    </td>



    <td>

    $${itemTotal}

    </td>



    <td>


    <button class="btn btn-danger"

    onclick="removeItem(${index})">

    Remove

    </button>


    </td>



    </tr>



    `;



    });





    document.getElementById("totalAmount").innerHTML =

    "Total: $" + total;





    function removeItem(index){


    cart.splice(index,1);



    localStorage.setItem(

    "cart",

    JSON.stringify(cart)

    );



    location.reload();


    }




</script>



</body>

</html>
