<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Checkout - Foodzilla</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        body{
        background:#fff8f3;
        font-family:'Segoe UI',sans-serif;
        }


        .checkout-card{

        background:white;

        padding:35px;

        border-radius:20px;

        box-shadow:0 5px 20px rgba(0,0,0,.1);

        margin-top:50px;

        }


        .btn-food{

        background:#ff6b35;

        color:white;

        font-weight:bold;

        }


        .btn-food:hover{

        background:#e85b28;

        color:white;

        }


    </style>

</head>


<body>


<div class="container">


    <div class="row justify-content-center">


        <div class="col-md-6">


            <div class="checkout-card">


                <h2 class="text-center mb-4">

                    🛒 Checkout

                </h2>



                <form action="/orders/create" method="post">



                    <label class="form-label">
                        Full Name
                    </label>


                    <input type="text"
                           name="customerName"
                           class="form-control mb-3"
                           placeholder="Enter your name"
                           required>



                    <label class="form-label">
                        Phone Number
                    </label>


                    <input type="text"
                           name="phone"
                           class="form-control mb-3"
                           placeholder="Enter phone number"
                           required>




                    <label class="form-label">
                        Order Type
                    </label>


                    <select name="orderType"
                            class="form-select mb-4">


                        <option value="Delivery">
                            Delivery
                        </option>


                        <option value="Pickup">
                            Pickup
                        </option>


                    </select>




                    <button type="submit"
                            class="btn btn-food w-100">

                        Continue To Payment 💳

                    </button>



                </form>



            </div>


        </div>


    </div>


</div>


</body>

</html>
